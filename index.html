<!DOCTYPE html>
<html>
<head>
<title>Para ti ❤️</title>
<style>
body { background: #fff0f5; font-family: sans-serif; text-align: center; }
h1 { color: #d63384; }
.galeria { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
.foto { background: white; border-radius: 20px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.foto img { width: 100%; border-radius: 15px; }
.frase { margin-top: 8px; color: #555; }
</style>
</head>
<body>
<h1>Nuestros Momentos</h1>
<div class="galeria">
  <div class="foto">
    <img src="foto1.jpg">
    <p class="frase">Tu frase aquí</p>
  </div>
</div>
</body>
</html>
